plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

def mcVersionForApi = project.minecraft_version
def encodedGameVersions = java.net.URLEncoder.encode('["' + mcVersionForApi + '"]', 'UTF-8')
def encodedLoaders = java.net.URLEncoder.encode('["fabric"]', 'UTF-8')
def apiUrl = 'https://api.modrinth.com/v2/project/fabric-api/version?game_versions=' + encodedGameVersions + '&loaders=' + encodedLoaders
def apiJson = new groovy.json.JsonSlurper().parse(new URL(apiUrl))
def apiRelease = apiJson.find { it.version_type == 'release' }
if (apiRelease == null) throw new GradleException("No stable Fabric API release found for Minecraft " + mcVersionForApi)
def detectedFabricApi = apiRelease.version_number

dependencies {
    minecraft("com.mojang:minecraft:" + project.minecraft_version)
    def mcVersion = project.minecraft_version

    def yarnXml = new XmlSlurper().parse(new URL('https://maven.fabricmc.net/net/fabricmc/yarn/maven-metadata.xml'))
    def yarnVersions = yarnXml.versioning.versions.version.collect { it.text() }
    def matchingYarn = yarnVersions.findAll { it.startsWith(mcVersion + '+build.') }
    if (matchingYarn.isEmpty()) throw new GradleException("Could not locate Yarn mappings for Minecraft " + mcVersion)
    def yarnMapping = matchingYarn.max { a, b ->
        (a.substring(a.lastIndexOf('build.') + 6) as int) <=> (b.substring(b.lastIndexOf('build.') + 6) as int)
    }
    mappings("net.fabricmc:yarn:" + yarnMapping + ":v2")
    modImplementation("net.fabricmc:fabric-loader:" + project.loader_version)
    modImplementation("net.fabricmc.fabric-api:fabric-api:" + detectedFabricApi)
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version, 'minecraft_version': project.minecraft_version
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
